<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homepage mobile mock (reference only)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A84FF}a:hover{color:#0047AB}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0D; color: #FFFFFF; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 56px 20px 0; display: flex; align-items: center; justify-content: space-between">
    <a href="#top" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #FFFFFF">
      <img src="../public/brand/mark-electric.png" alt="Swiftly Built" style="height: 34px; width: auto; display: block">
      <span style="font-family: 'Inter Tight', 'Inter', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -0.03em; display: inline-block; transform: skewX(-8deg)">Swiftly Built</span>
    </a>
    <button type="button" aria-label="Open menu" style="width: 44px; height: 44px; border: 1px solid #2A2A2E; border-radius: 8px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
  </header>

  <section style="padding: 48px 20px 0; display: flex; flex-direction: column; gap: 20px; flex-grow: 1">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #0A84FF">iOS · Android · AI · Tech support</div>
    <h1 style="margin: 0; font-family: 'Inter Tight', 'Inter', sans-serif; font-weight: 800; font-size: 56px; line-height: 0.98; letter-spacing: -0.04em">Fast.<br>Complete.<br>Built to last<span style="color: #FF3B4E">.</span></h1>
    <p style="margin: 0; font-size: 17px; line-height: 1.5; color: #D4D4D8">Production-ready iOS and Android apps, delivered end to end by one engineer. Weeks, not quarters.</p>
    <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 8px">
      <a href="#contact" style="background: #0A84FF; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 600; padding: 16px 22px; border-radius: 8px; min-height: 52px; display: inline-flex; align-items: center; justify-content: center">Book a 20-minute call</a>
      <a href="#work" style="border: 1px solid #52525B; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 600; padding: 16px 22px; border-radius: 8px; min-height: 52px; display: inline-flex; align-items: center; justify-content: center">See the work</a>
    </div>
  </section>

  <section style="border-top: 1px solid #2A2A2E; background: #0F0F12; padding: 24px 20px 32px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px"><div style="font-family: 'Inter Tight', 'Inter', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.03em; color: #0A84FF">3 wks</div><div style="font-size: 13px; color: #A1A1AA">average turnaround</div></div>
    <div style="display: flex; flex-direction: column; gap: 4px"><div style="font-family: 'Inter Tight', 'Inter', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.03em; color: #0A84FF">8 yrs</div><div style="font-size: 13px; color: #A1A1AA">defense technology</div></div>
    <div style="display: flex; flex-direction: column; gap: 4px"><div style="font-family: 'Inter Tight', 'Inter', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.03em; color: #0A84FF">TS/SCI</div><div style="font-size: 13px; color: #A1A1AA">active clearance</div></div>
  </section>

</div>
</body>
</html>
